<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Outlander Pro">
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleTouchIcon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>Outlander Pro · Gerenciador de Vendas</title>
<style>
  :root{
    --bg:#12151C;
    --surface:#1B2029;
    --surface-raised:#232936;
    --border:#2C3340;
    --copper:#C77C3C;
    --copper-dim:rgba(199,124,60,0.14);
    --copper-text:#1A0F05;
    --teal:#2DD4BF;
    --teal-dim:#1a4d47;
    --amber:#F5A623;
    --amber-dim:#4d3b14;
    --red:#E8635D;
    --red-dim:#4d2320;
    --text:#E8EAED;
    --text-dim:#8B92A0;
    --text-faint:#5A6070;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk','Inter',sans-serif;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono','Courier New',monospace; letter-spacing:0.02em;}
  #app{display:flex; min-height:100vh; position:relative; z-index:1;}

  /* ---------- FUNDO ANIMADO GERAL (mesh gradient) ---------- */
  .mesh-bg{
    position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
    background:var(--bg);
  }
  .mesh-bg span{
    position:absolute; border-radius:50%; filter:blur(90px); opacity:0.32; mix-blend-mode:screen;
    will-change:transform;
  }
  .mesh-bg span:nth-child(1){
    width:560px; height:560px; background:var(--copper); top:-160px; left:-120px;
    animation:meshDrift1 24s ease-in-out infinite;
  }
  .mesh-bg span:nth-child(2){
    width:480px; height:480px; background:var(--teal); bottom:-160px; right:-100px;
    animation:meshDrift2 28s ease-in-out infinite;
  }
  .mesh-bg span:nth-child(3){
    width:420px; height:420px; background:var(--amber); top:38%; left:55%;
    animation:meshDrift3 32s ease-in-out infinite; opacity:0.18;
  }
  @keyframes meshDrift1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(70px,50px) scale(1.15); }
  }
  @keyframes meshDrift2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-60px,-40px) scale(1.1); }
  }
  @keyframes meshDrift3{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-50px,60px) scale(1.2); }
  }
  @media (prefers-reduced-motion: reduce){
    .mesh-bg span{ animation:none; }
  }

  /* ---------- LOGIN ---------- */
  .login-screen{
    width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .login-content{display:flex; align-items:center; gap:44px; position:relative; z-index:1; max-width:880px; width:100%; justify-content:center; padding:0 24px;}
  .login-hero-img{display:none;}
  @media (min-width:900px){
    .login-hero-img{
      display:block; width:270px; height:auto; border-radius:20px;
      filter:drop-shadow(0 24px 48px rgba(0,0,0,0.55));
    }
  }

  /* ---------- MASCOTE ---------- */
  .mascot-float{animation:mascotFloat 3.2s ease-in-out infinite;}
  @keyframes mascotFloat{0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);}}
  .empty-state-mascot{
    display:flex; flex-direction:column; align-items:center; gap:12px; padding:48px 20px;
    color:var(--text-faint); border:1px dashed var(--border); border-radius:12px; font-size:14px; text-align:center;
  }
  .page-mascot{
    width:56px; height:56px; object-fit:cover; border-radius:14px; flex-shrink:0;
    border:1px solid var(--border); box-shadow:0 6px 16px rgba(0,0,0,0.35);
  }
  .page-header-with-mascot{display:flex; align-items:center; gap:14px;}
  @media (max-width:860px){
    .page-mascot{width:44px; height:44px; border-radius:11px;}
  }
  .login-box{width:380px; padding:40px 36px; background:var(--surface); border:1px solid var(--border); border-radius:16px; position:relative; z-index:1;}
  .login-logo-row{display:flex; align-items:center; gap:14px; margin-bottom:22px;}
  .login-wordmark{display:flex; align-items:baseline; gap:7px;}
  .login-brand-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; letter-spacing:-0.01em; font-style:italic; transform:skewX(-2deg); display:inline-block;}
  .brand-pro-chip{
    font-size:10px; font-weight:700; background:var(--copper); color:var(--copper-text); padding:2px 7px;
    border-radius:5px; letter-spacing:0.07em; flex-shrink:0;
  }
  .login-box h1{font-size:26px; margin-bottom:4px;}
  .login-sub{color:var(--text-dim); font-size:13px; margin-bottom:28px;}
  .socio-list{display:flex; flex-direction:column; gap:8px; margin-bottom:20px;}
  .socio-btn{
    display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--surface-raised);
    border:1px solid var(--border); border-radius:10px; cursor:pointer; color:var(--text); font-size:15px;
    transition:border-color .15s;
  }
  .socio-btn:hover{border-color:var(--copper);}
  .avatar{width:30px; height:30px; border-radius:50%; background:var(--copper-dim); color:var(--copper);
    display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex-shrink:0;}
  .pin-row{display:none; gap:8px; margin-top:8px;}
  .pin-row.active{display:flex;}
  input, select{
    background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:10px 12px; font-size:14px; font-family:inherit; width:100%;
  }
  input:focus, select:focus{outline:none; border-color:var(--copper);}
  .btn{
    background:var(--copper); color:var(--copper-text); border:none; border-radius:8px; padding:10px 16px;
    font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text); border-color:var(--text-dim);}
  .btn-danger{background:var(--red); color:#2a0f0d;}
  .btn-sm{padding:6px 12px; font-size:13px;}
  .link-btn{background:none; border:none; color:var(--copper); font-size:13px; cursor:pointer; font-family:inherit;}
  .new-socio-form{display:none; flex-direction:column; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid var(--border);}
  .new-socio-form.active{display:flex;}
  .error-msg{color:var(--red); font-size:13px; margin-top:6px;}

  /* ---------- SHELL ---------- */
  .sidebar{
    width:220px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:24px 0; flex-shrink:0;
  }
  .brand{padding:0 20px 22px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .brand-row{display:flex; align-items:center; gap:10px;}
  .brand-wordmark{display:flex; align-items:baseline; gap:6px;}
  .brand-title{font-size:16px; font-weight:700; font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; font-style:italic;}
  .brand-sub{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em; margin-top:3px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:11px 20px; color:var(--text-dim);
    cursor:pointer; font-size:14px; border-left:3px solid transparent;
  }
  .nav-item:hover{color:var(--text); background:rgba(255,255,255,0.02);}
  .nav-item.active{color:var(--copper); border-left-color:var(--copper); background:var(--copper-dim);}
  .sidebar-footer{margin-top:auto; padding:16px 20px 0; border-top:1px solid var(--border);}
  .who{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .who-name{font-size:13px; font-weight:600;}
  .who-role{font-size:11px; color:var(--text-faint);}

  .main{flex:1; padding:32px 40px; overflow-y:auto;}
  .page-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px;}
  .page-title{font-size:24px; font-weight:600;}
  .page-sub{color:var(--text-dim); font-size:13px; margin-top:4px;}

  /* ---------- MOBILE TOPBAR & DRAWER ---------- */
  .topbar{
    display:none; align-items:center; gap:14px; padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top, 0px));
    background:var(--surface); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:40;
  }
  .hamburger{
    width:36px; height:36px; border-radius:9px; background:var(--surface-raised); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; color:var(--text);
    font-size:16px;
  }
  .topbar-title{font-size:16px; font-weight:600; flex:1;}
  .sidebar-backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:49;
  }
  .sidebar-backdrop.open{display:block;}

  @media (max-width:860px){
    body{overflow-x:hidden;}
    .topbar{display:flex;}
    #app{flex-direction:column;}
    .sidebar{
      position:fixed; top:0; left:0; height:100%; z-index:50; width:78vw; max-width:300px;
      transform:translateX(-105%); transition:transform .22s ease; padding-top:calc(24px + env(safe-area-inset-top,0px));
      padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
    }
    .sidebar.open{transform:translateX(0);}
    .main{padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .page-header{flex-direction:column; align-items:stretch; gap:12px;}
    .page-header .btn{width:100%;}
    .item-card{flex-wrap:wrap;}
    .item-actions{width:100%; justify-content:flex-end;}
    .login-box{width:100%; max-width:380px;}
    .modal{max-height:92vh;}
  }

  /* ---------- KPI CARDS ---------- */
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px;}
  .kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px;}
  .kpi-label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px;}
  .kpi-value{font-size:24px; font-weight:600; font-family:'IBM Plex Mono',monospace;}
  .kpi-value.teal{color:var(--teal);}
  .kpi-value.amber{color:var(--amber);}

  .alert-banner{
    background:var(--amber-dim); border:1px solid var(--amber); border-radius:10px; padding:12px 16px;
    margin-bottom:20px; font-size:13px; display:flex; align-items:center; gap:10px; color:#ffd699;
  }

  /* ---------- SEAL (signature element) ---------- */
  .seal{
    width:52px; height:52px; border-radius:50%; flex-shrink:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; border:2px dashed; font-family:'IBM Plex Mono',monospace;
  }
  .seal .seal-label{font-size:6px; letter-spacing:0.05em; text-transform:uppercase; opacity:0.8;}
  .seal .seal-num{font-size:13px; font-weight:700; line-height:1.1;}
  .seal.ativo{border-color:var(--teal); color:var(--teal); background:rgba(45,212,191,0.08);}
  .seal.vencendo{border-color:var(--amber); color:var(--amber); background:rgba(245,166,35,0.08);}
  .seal.vencida{border-color:var(--red); color:var(--red); background:rgba(232,99,93,0.08);}
  .seal.vendido-sg{border-color:var(--text-faint); color:var(--text-faint); background:rgba(255,255,255,0.02);}
  .seal.estoque{border-color:var(--text-dim); color:var(--text-dim); background:rgba(255,255,255,0.02);}

  /* ---------- LIST / TABLE ---------- */
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px;}
  .search-input{max-width:280px;}
  .card-list{display:flex; flex-direction:column; gap:10px;}
  .item-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;
    display:flex; align-items:center; gap:16px;
  }
  .item-info{flex:1; min-width:0;}
  .item-title{font-size:15px; font-weight:600; margin-bottom:3px;}
  .item-meta{font-size:12px; color:var(--text-dim); display:flex; gap:14px; flex-wrap:wrap;}
  .item-meta span{white-space:nowrap;}
  .tag{
    font-size:10px; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:0.04em;
    font-weight:600;
  }
  .tag.estoque{background:rgba(139,146,160,0.15); color:var(--text-dim);}
  .tag.vendido{background:var(--teal-dim); color:var(--teal);}
  .tag.troca{background:var(--amber-dim); color:var(--amber);}
  .item-actions{display:flex; gap:8px; flex-shrink:0;}
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-faint); border:1px dashed var(--border);
    border-radius:12px; font-size:14px;
  }

  /* ---------- FOTOS / DRIVE ---------- */
  .foto-thumb{
    width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0; border:1px solid var(--border);
    cursor:pointer;
  }
  .foto-placeholder{
    width:52px; height:52px; border-radius:10px; flex-shrink:0; border:1px dashed var(--border);
    display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--text-faint);
    cursor:pointer; background:var(--surface-raised);
  }
  .price-hint{
    font-size:12px; color:var(--copper); background:var(--copper-dim); padding:8px 10px; border-radius:8px;
    margin:-4px 0 14px; display:none;
  }
  .price-hint.active{display:block;}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-overlay.active{display:flex;}
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px;
    width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
  }
  .modal h3{font-size:18px; margin-bottom:20px;}
  .field-group{margin-bottom:14px;}
  .field-label{font-size:12px; color:var(--text-dim); margin-bottom:6px; display:block;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px;}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin:14px 0; font-size:14px;}
  .checkbox-row input{width:auto;}
  .sub-form{
    border:1px solid var(--border); border-radius:10px; padding:14px; margin-top:10px; background:var(--bg);
    display:none;
  }
  .sub-form.active{display:block;}
  .sub-form-title{font-size:12px; color:var(--amber); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px; font-weight:600;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
</style>
</head>

<div id="app"></div>

let storageMode = 'memory'; // 'supabase' | 'claude' | 'memory'
let supabaseClient = null;

async function initStorage(){
  if(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
    try{
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      storageMode = 'supabase';
      return;
    }catch(e){ console.error('Falha ao iniciar Supabase', e); }
  }
  if(window.storage){
    storageMode = 'claude';
    return;
  }
  storageMode = 'memory';
}

async function storageGet(key){
  if(storageMode==='supabase'){
    const { data, error } = await supabaseClient.from('outlander_storage').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    return data ? data.value : null;
  }
  if(storageMode==='claude'){
    const res = await window.storage.get(key, true);
    return res && res.value ? JSON.parse(res.value) : null;
  }
  return null;
}

async function storageSet(key, value){
  if(storageMode==='supabase'){
    const { error } = await supabaseClient.from('outlander_storage')
      .upsert({ key, value, updated_at: new Date().toISOString() });
    if(error) throw error;
    return;
  }
  if(storageMode==='claude'){
    await window.storage.set(key, JSON.stringify(value), true);
    return;
  }
  // modo memória: não persiste entre sessões
}

async function loadData(){
  await initStorage();
  try{
    const data = await storageGet(STORE_KEY);
    if(data){
      state = data;
      state.socios = state.socios || [];
      state.aparelhos = state.aparelhos || [];
      state.vendas = state.vendas || [];
      state.clientes = state.clientes || [];
      state.orcamentos = state.orcamentos || [];
      state.precos = state.precos || [];
    }
  }catch(e){
    console.error('Erro ao carregar dados', e);
    // segue com estado padrão
  }
  render();
}

async function saveData(){
  try{
    await storageSet(STORE_KEY, state);
  }catch(e){
    console.error('Erro ao salvar', e);
    alert('Não foi possível salvar os dados. Verifique a configuração do Supabase (URL/chave) ou sua conexão.');
  }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function fmtMoney(v){
  return (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('pt-BR');
}
function addMonths(dateStr, months){
  const d = new Date(dateStr);
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}
function daysUntil(dateStr){
  const now = new Date(); now.setHours(0,0,0,0);
  const target = new Date(dateStr);
  return Math.round((target-now)/86400000);
}
function garantiaStatus(venda){
  const d = daysUntil(venda.garantiaAte);
  if(d < 0) return 'vencida';
  if(d <= 15) return 'vencendo';
  return 'ativo';
}
function initials(nome){
  return nome.trim().split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();
}

function diasDesde(dateStr){
  const now = new Date(); now.setHours(0,0,0,0);
  const target = new Date(dateStr);
  return Math.round((now-target)/86400000);
}
function orcamentoUrgencia(o){
  if(o.status !== 'aberto') return 'fechado';
  const d = diasDesde(o.dataOrcamento);
  if(d >= 15) return 'vencida';
  if(d >= 7) return 'vencendo';
  return 'ativo';
}
function parseDriveLink(url){
  if(!url) return null;
  url = url.trim();
  const folderMatch = url.match(/folders\/([a-zA-Z0-9_-]+)/);
  if(folderMatch) return { type:'folder', id:folderMatch[1], url };
  const fileMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(fileMatch) return { type:'file', id:fileMatch[1], url, imgSrc:`https://drive.google.com/uc?export=view&id=${fileMatch[1]}` };
  return { type:'other', url };
}
function renderFotoThumb(url){
  const drive = parseDriveLink(url);
  if(!drive) return `<div class="foto-placeholder" title="Sem foto">📷</div>`;
  if(drive.type==='file'){
    return `<a href="${drive.url}" target="_blank" rel="noopener"><img class="foto-thumb" src="${drive.imgSrc}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'foto-placeholder',innerText:'📁',title:'Abrir no Drive'}))"></a>`;
  }
  return `<a href="${drive.url}" target="_blank" rel="noopener" class="foto-placeholder" title="Ver fotos no Drive">📁</a>`;
}
function findPrecoRef(marca, modelo){
  if(!marca && !modelo) return null;
  const termo = `${marca} ${modelo}`.toLowerCase().trim();
  return state.precos.find(p => termo.includes(p.modelo.toLowerCase()) && (!p.marca || termo.includes(p.marca.toLowerCase())));
}

      document.querySelectorAll('.pin-row').forEach(r=>r.classList.remove('active'));
      document.getElementById(`pinRow-${nome.replace(/\s/g,'_')}`).classList.add('active');
      document.getElementById(`pinInput-${nome.replace(/\s/g,'_')}`).focus();
    });
  });
  document.querySelectorAll('[data-confirm]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const nome = btn.dataset.confirm;
      const pin = document.getElementById(`pinInput-${nome.replace(/\s/g,'_')}`).value;
      const socio = state.socios.find(s=>s.nome===nome);
      if(socio && socio.pin === pin){
        session = { nome: socio.nome };
        currentTab = 'dashboard';
        render();
      }else{
        document.getElementById('loginError').textContent = 'PIN incorreto.';
      }
    });
  });
  document.getElementById('toggleNewSocio').addEventListener('click', ()=>{
    document.getElementById('newSocioForm').classList.toggle('active');
  });
  document.getElementById('confirmNewSocio').addEventListener('click', async ()=>{
    const nome = document.getElementById('newSocioNome').value.trim();
    const pin = document.getElementById('newSocioPin').value.trim();
    const err = document.getElementById('loginError');
    if(!nome || pin.length !== 4 || !/^\d{4}$/.test(pin)){
      err.textContent = 'Informe um nome e um PIN de 4 números.';
      return;
    }
    if(state.socios.find(s=>s.nome.toLowerCase()===nome.toLowerCase())){
      err.textContent = 'Já existe um sócio com esse nome.';
      return;
    }
    state.socios.push({nome, pin});
    await saveData();
    session = {nome};
    currentTab = 'dashboard';
    render();
  });
}

function attachShellEvents(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ currentTab = el.dataset.tab; searchTerm=''; sidebarOpen=false; render(); });
  });
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    session = null; render();
  });
  document.getElementById('btnAbrirMenu')?.addEventListener('click', ()=>{
    sidebarOpen = true; render();
  });
  document.getElementById('sidebarBackdrop')?.addEventListener('click', ()=>{
    sidebarOpen = false; render();
  });
  attachPageEvents();
}

function renderPage(){
  if(currentTab==='dashboard') return renderDashboard();
  if(currentTab==='estoque') return renderEstoque();
  if(currentTab==='vendas') return renderVendas();
  if(currentTab==='orcamentos') return renderOrcamentos();
  if(currentTab==='clientes') return renderClientes();
  if(currentTab==='precos') return renderPrecos();
  if(currentTab==='socios') return renderSocios();
  return '';
}

function renderDashboard(){

  const lucro = state.vendas.reduce((s,v)=>{
    const ap = state.aparelhos.find(a=>a.id===v.aparelhoId);
    return s + (Number(v.valorVenda||0) - Number(ap?.custo||0));
  },0);
  const vencendo = state.vendas.filter(v=>garantiaStatus(v)==='vencendo');
  const orcamentosAbertos = state.orcamentos.filter(o=>o.status==='aberto');
  const orcamentosParaRemarketing = orcamentosAbertos.filter(o=>['vencendo','vencida'].includes(orcamentoUrgencia(o)));

  return `

    ${orcamentosParaRemarketing.length>0 ? `

        🎯 ${orcamentosParaRemarketing.length} orçamento${orcamentosParaRemarketing.length>1?'s':''} sem retorno há mais de 7 dias — bom momento pra remarketing.
      </div>` : ''}

      <div class="page-header-with-mascot">
        ${pageHeaderMascot('dashboard')}
        <div>
          <div class="page-title display">Visão geral</div>
          <div class="page-sub">Resumo do negócio, atualizado em tempo real entre os sócios</div>
        </div>
      </div>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Em estoque</div>
        <div class="kpi-value">${emEstoque.length}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Capital investido em estoque</div>
        <div class="kpi-value">${fmtMoney(valorInvestido)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Faturamento total</div>
        <div class="kpi-value teal">${fmtMoney(faturamento)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Lucro total</div>
        <div class="kpi-value ${lucro>=0?'teal':'amber'}">${fmtMoney(lucro)}</div>
      </div>
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="kpi-card">
        <div class="kpi-label">Orçamentos em aberto</div>
        <div class="kpi-value">${orcamentosAbertos.length}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Valor potencial em orçamentos abertos</div>
        <div class="kpi-value amber">${fmtMoney(valorOrcadoAberto)}</div>
      </div>
    </div>
    <h3 style="margin-bottom:12px; font-size:15px; color:var(--text-dim);">Garantias que precisam de atenção</h3>
    ${vencendo.length===0 ? emptyStateMascot('Nenhuma garantia vencendo nos próximos 15 dias.') :
      `<div class="card-list">${vencendo.map(v=>renderVendaCard(v)).join('')}</div>`}
    <h3 style="margin:24px 0 12px; font-size:15px; color:var(--text-dim);">Leads para remarketing</h3>

function renderOrcamentos(){
  let list = state.orcamentos.slice().sort((a,b)=>{
    // abertos mais antigos primeiro (precisam de remarketing), depois fechados por data desc
    if(a.status==='aberto' && b.status!=='aberto') return -1;
    if(a.status!=='aberto' && b.status==='aberto') return 1;
    if(a.status==='aberto' && b.status==='aberto') return (a.dataOrcamento||'').localeCompare(b.dataOrcamento||'');
    return (b.dataOrcamento||'').localeCompare(a.dataOrcamento||'');
  });
  return `
    <div class="page-header">
      <div class="page-header-with-mascot">
        ${pageHeaderMascot('orcamentos')}

      `<div class="card-list">${list.map(renderOrcamentoCard).join('')}</div>`}

function renderOrcamentoCard(o){
  const cliente = state.clientes.find(c=>c.id===o.clienteId);
  const urgencia = orcamentoUrgencia(o);
  const dias = diasDesde(o.dataOrcamento);
  let sealLabel = 'Orçado', sealNum = `${dias}d`;
  if(o.status==='convertido'){ sealLabel = 'Vendido'; sealNum='✓'; }
  if(o.status==='perdido'){ sealLabel = 'Perdido'; sealNum='✕'; }
  const sealClass = o.status==='convertido' ? 'ativo' : o.status==='perdido' ? 'vendido-sg' : urgencia;
  return `
    <div class="item-card">
      <div class="seal ${sealClass}">
        <div class="seal-label">${sealLabel}</div>
        <div class="seal-num">${sealNum}</div>
      </div>
      <div class="item-info">
        <div class="item-title">${cliente ? cliente.nome : 'Cliente não identificado'} — ${o.aparelhoDesejado}</div>
        <div class="item-meta">
          <span>Valor orçado: ${fmtMoney(o.valorOrcado)}</span>
          <span>Data: ${fmtDate(o.dataOrcamento)}</span>
          ${cliente?.telefone ? `<span class="mono">${cliente.telefone}</span>` : ''}

        ${o.status==='aberto' ? `

          <div class="field-group"><label class="field-label">Condição</label><input id="tCondicao"></div>
          <div class="field-group"><label class="field-label">Fotos (link do Google Drive)</label><input id="tFotosUrl" placeholder="Opcional"></div>

          <label class="field-label">Cliente</label>

            <option value="">Selecione um cliente</option>
            ${state.clientes.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('')}
          </select>
        </div>
        <button type="button" class="link-btn" id="btnClienteRapido" style="margin-bottom:12px;">+ Cadastrar cliente novo</button>

    <div class="modal-overlay" id="modalPreco">

          <div class="field-group"><label class="field-label">Modelo</label><input id="pModelo" placeholder="Ex: Galaxy S21"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><label class="field-label">Preço de compra aprox. (R$)</label><input type="number" id="pPrecoCompra" placeholder="0,00"></div>
          <div class="field-group"><label class="field-label">Preço de venda aprox. (R$)</label><input type="number" id="pPrecoVenda" placeholder="0,00"></div>
        </div>
        <div class="field-group"><label class="field-label">Observações</label><input id="pObs" placeholder="Opcional"></div>
        <div class="modal-actions">
          <button class="btn-ghost btn" data-close-modal="modalPreco">Cancelar</button>
          <button class="btn" id="salvarPreco">Salvar</button>
        </div>
      </div>
    </div>
  `;
}

function openModal(id){ document.getElementById(id).classList.add('active'); }
function closeModal(id){ document.getElementById(id).classList.remove('active'); }

// ================= PAGE EVENTS =================
function attachPageEvents(){
  // search boxes
  const se = document.getElementById('searchEstoque');
  if(se) se.addEventListener('input', e=>{ searchTerm = e.target.value; render(); refocusSearch('searchEstoque'); });
  const sv = document.getElementById('searchVendas');
  if(sv) sv.addEventListener('input', e=>{ searchTerm = e.target.value; render(); refocusSearch('searchVendas'); });

  // novo aparelho
  const btnNovo = document.getElementById('btnNovoAparelho');
  if(btnNovo) btnNovo.addEventListener('click', ()=>{
    document.getElementById('modalAparelhoTitle').textContent = 'Novo aparelho';
    ['aparelhoId','fMarca','fModelo','fArmazenamento','fCor','fImei','fFotosUrl','fCusto','fCondicao','fObs'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('fDataEntrada').value = new Date().toISOString().slice(0,10);
    document.getElementById('precoHint').classList.remove('active');
    openModal('modalAparelho');
  });

  const atualizarPrecoHint = ()=>{
    const marca = document.getElementById('fMarca').value;
    const modelo = document.getElementById('fModelo').value;
    const ref = findPrecoRef(marca, modelo);
    const hint = document.getElementById('precoHint');
    if(ref){
      hint.textContent = `💡 Referência para ${ref.marca} ${ref.modelo}: compra ~${fmtMoney(ref.precoCompra)} · venda ~${fmtMoney(ref.precoVenda)}`;
      hint.classList.add('active');
    }else{
      hint.classList.remove('active');
    }
  };
  document.getElementById('fMarca')?.addEventListener('input', atualizarPrecoHint);
  document.getElementById('fModelo')?.addEventListener('input', atualizarPrecoHint);

  document.querySelectorAll('[data-editar-aparelho]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const a = state.aparelhos.find(x=>x.id===btn.dataset.editarAparelho);
      document.getElementById('modalAparelhoTitle').textContent = 'Editar aparelho';
      document.getElementById('aparelhoId').value = a.id;
      document.getElementById('fMarca').value = a.marca||'';
      document.getElementById('fModelo').value = a.modelo||'';
      document.getElementById('fArmazenamento').value = a.armazenamento||'';
      document.getElementById('fCor').value = a.cor||'';
      document.getElementById('fImei').value = a.imei||'';
      document.getElementById('fFotosUrl').value = a.fotosDriveUrl||'';
      document.getElementById('fCusto').value = a.custo||'';
      document.getElementById('fDataEntrada').value = a.dataEntrada||'';
      document.getElementById('fCondicao').value = a.condicao||'';
      document.getElementById('fObs').value = a.obs||'';
      document.getElementById('precoHint').classList.remove('active');
      openModal('modalAparelho');
    });
  });

  document.querySelectorAll('[data-excluir-aparelho]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const a = state.aparelhos.find(x=>x.id===btn.dataset.excluirAparelho);
      const aviso = a && a.status==='vendido'
        ? `Este aparelho já foi vendido. Excluir não apaga o registro da venda, mas ela deixará de mostrar os detalhes do aparelho. Excluir mesmo assim?`
        : 'Excluir este aparelho do estoque? Essa ação não pode ser desfeita.';
      if(!confirm(aviso)) return;
      state.aparelhos = state.aparelhos.filter(x=>x.id!==btn.dataset.excluirAparelho);
      await saveData();
      render();
    });
  });

  document.querySelectorAll('[data-vender]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const a = state.aparelhos.find(x=>x.id===btn.dataset.vender);
      document.getElementById('modalVendaTitle').textContent = 'Vender aparelho';
      document.getElementById('vendaAparelhoId').value = a.id;
      document.getElementById('vendaClienteId').value = '';
      document.getElementById('vendaOrcamentoId').value = '';
      document.getElementById('vendaSelecionarAparelhoWrap').style.display = 'none';
      document.getElementById('vendaAparelhoResumo').textContent = `${a.marca} ${a.modelo} · Custo: ${fmtMoney(a.custo)}`;
      ['vComprador','vContato','vValor','vFormaPagamento'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('vData').value = new Date().toISOString().slice(0,10);
      document.getElementById('vTemTroca').checked = false;
      document.getElementById('trocaSubForm').classList.remove('active');
      ['tMarca','tModelo','tImei','tValor','tCondicao','tFotosUrl'].forEach(id=>document.getElementById(id).value='');
      openModal('modalVenda');
    });
  });

  document.querySelectorAll('[data-converter-orcamento]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const o = state.orcamentos.find(x=>x.id===btn.dataset.converterOrcamento);
      const cliente = state.clientes.find(c=>c.id===o.clienteId);
      document.getElementById('modalVendaTitle').textContent = 'Registrar venda a partir do orçamento';
      document.getElementById('vendaAparelhoId').value = '';
      document.getElementById('vendaClienteId').value = o.clienteId||'';
      document.getElementById('vendaOrcamentoId').value = o.id;
      document.getElementById('vendaAparelhoResumo').textContent = `Interesse original: ${o.aparelhoDesejado} · Orçado: ${fmtMoney(o.valorOrcado)}`;
      const select = document.getElementById('vAparelhoSelect');
      const disponiveis = state.aparelhos.filter(a=>a.status==='estoque');
      select.innerHTML = `<option value="">Selecione um aparelho em estoque</option>` +
        disponiveis.map(a=>`<option value="${a.id}">${a.marca} ${a.modelo} ${a.armazenamento||''} — ${fmtMoney(a.custo)}</option>`).join('');
      document.getElementById('vendaSelecionarAparelhoWrap').style.display = 'block';
      document.getElementById('vComprador').value = cliente ? cliente.nome : '';
      document.getElementById('vContato').value = cliente ? (cliente.telefone||'') : '';
      document.getElementById('vValor').value = o.valorOrcado || '';
      document.getElementById('vFormaPagamento').value = '';
      document.getElementById('vData').value = new Date().toISOString().slice(0,10);
      document.getElementById('vTemTroca').checked = false;
      document.getElementById('trocaSubForm').classList.remove('active');
      ['tMarca','tModelo','tImei','tValor','tCondicao','tFotosUrl'].forEach(id=>document.getElementById(id).value='');
      openModal('modalVenda');
    });
  });

  document.querySelectorAll('[data-perder-orcamento]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Marcar este orçamento como perdido?')) return;
      const o = state.orcamentos.find(x=>x.id===btn.dataset.perderOrcamento);
      o.status = 'perdido';
      await saveData();
      render();
    });
  });

  document.querySelectorAll('[data-editar-venda]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const v = state.vendas.find(x=>x.id===btn.dataset.editarVenda);
      const ap = state.aparelhos.find(a=>a.id===v.aparelhoId);
      const status = garantiaStatus(v);
      const statusLabel = status==='vencida'?'Vencida':status==='vencendo'?'Vencendo em breve':'Ativa';
      document.getElementById('vendaDetalheContent').innerHTML = `
        <div class="field-group"><span class="field-label">Aparelho</span>${ap?`${ap.marca} ${ap.modelo}`:'—'}</div>
        <div class="field-group"><span class="field-label">Comprador</span>${v.comprador} ${v.contato?`· ${v.contato}`:''}</div>
        <div class="field-group"><span class="field-label">Valor da venda</span>${fmtMoney(v.valorVenda)}</div>
        <div class="field-group"><span class="field-label">Forma de pagamento</span>${v.formaPagamento||'—'}</div>
        <div class="field-group"><span class="field-label">Data da venda</span>${fmtDate(v.dataVenda)}</div>
        <div class="field-group"><span class="field-label">Garantia até</span>${fmtDate(v.garantiaAte)} (${statusLabel})</div>
        <div class="field-group"><span class="field-label">Sócio responsável</span>${v.socio}</div>
      `;
      openModal('modalVendaDetalhe');
    });
  });

  document.querySelectorAll('[data-remover-socio]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm(`Remover ${btn.dataset.removerSocio} da lista de sócios?`)) return;
      state.socios = state.socios.filter(s=>s.nome!==btn.dataset.removerSocio);
      await saveData();
      render();
    });
  });

  const btnNovoSocio = document.getElementById('btnNovoSocio');
  if(btnNovoSocio) btnNovoSocio.addEventListener('click', async ()=>{
    const nome = prompt('Nome do novo sócio:');
    if(!nome) return;
    let pin = prompt('PIN de 4 dígitos para esse sócio:');
    if(!pin || !/^\d{4}$/.test(pin)){ alert('PIN inválido. Deve ter 4 números.'); return; }
    if(state.socios.find(s=>s.nome.toLowerCase()===nome.toLowerCase())){ alert('Já existe um sócio com esse nome.'); return; }
    state.socios.push({nome, pin});
    await saveData();
    render();
  });

  document.getElementById('vTemTroca')?.addEventListener('change', e=>{
    document.getElementById('trocaSubForm').classList.toggle('active', e.target.checked);
  });

  // search clientes
  const scEl = document.getElementById('searchClientes');
  if(scEl) scEl.addEventListener('input', e=>{ searchTerm = e.target.value; render(); refocusSearch('searchClientes'); });

  const btnNovoCliente = document.getElementById('btnNovoCliente');
  if(btnNovoCliente) btnNovoCliente.addEventListener('click', ()=>{
    document.getElementById('modalClienteTitle').textContent = 'Novo cliente';
    ['clienteId','cNome','cTelefone','cEmail','cObs'].forEach(id=>document.getElementById(id).value='');
    openModal('modalCliente');
  });

  document.querySelectorAll('[data-editar-cliente]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const c = state.clientes.find(x=>x.id===btn.dataset.editarCliente);
      document.getElementById('modalClienteTitle').textContent = 'Editar cliente';
      document.getElementById('clienteId').value = c.id;
      document.getElementById('cNome').value = c.nome||'';
      document.getElementById('cTelefone').value = c.telefone||'';
      document.getElementById('cEmail').value = c.email||'';
      document.getElementById('cObs').value = c.obs||'';
      openModal('modalCliente');
    });
  });

  document.querySelectorAll('[data-excluir-cliente]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const c = state.clientes.find(x=>x.id===btn.dataset.excluirCliente);
      const temHistorico = state.vendas.some(v=>v.clienteId===c.id) || state.orcamentos.some(o=>o.clienteId===c.id);
      const aviso = temHistorico
        ? 'Este cliente tem vendas ou orçamentos vinculados. O cadastro será removido, mas o histórico de vendas/orçamentos continua registrado. Excluir mesmo assim?'
        : 'Excluir este cliente? Essa ação não pode ser desfeita.';
      if(!confirm(aviso)) return;
      state.clientes = state.clientes.filter(x=>x.id!==btn.dataset.excluirCliente);
      await saveData();
      render();
    });
  });

  document.getElementById('salvarCliente')?.addEventListener('click', async ()=>{
    const id = document.getElementById('clienteId').value;
    const nome = document.getElementById('cNome').value.trim();
    if(!nome){ alert('Informe o nome do cliente.'); return; }
    const data = {
      nome,
      telefone: document.getElementById('cTelefone').value.trim(),
      email: document.getElementById('cEmail').value.trim(),
      obs: document.getElementById('cObs').value.trim(),
    };
    if(id){
      const c = state.clientes.find(x=>x.id===id);
      Object.assign(c, data);
    }else{
      state.clientes.push({ id: uid(), dataCadastro: new Date().toISOString().slice(0,10), ...data });
    }
    await saveData();
    closeModal('modalCliente');
    render();
  });

  // orçamentos
  const btnNovoOrcamento = document.getElementById('btnNovoOrcamento');
  if(btnNovoOrcamento) btnNovoOrcamento.addEventListener('click', ()=>{
    document.getElementById('modalOrcamentoTitle').textContent = 'Novo orçamento';
    ['orcamentoId','oClienteId','oAparelhoDesejado','oValor','oCanal','oObs'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('oData').value = new Date().toISOString().slice(0,10);
    openModal('modalOrcamento');
  });

  document.querySelectorAll('[data-editar-orcamento]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const o = state.orcamentos.find(x=>x.id===btn.dataset.editarOrcamento);
      document.getElementById('modalOrcamentoTitle').textContent = 'Editar orçamento';
      document.getElementById('orcamentoId').value = o.id;
      document.getElementById('oClienteId').value = o.clienteId||'';
      document.getElementById('oAparelhoDesejado').value = o.aparelhoDesejado||'';
      document.getElementById('oValor').value = o.valorOrcado||'';
      document.getElementById('oData').value = o.dataOrcamento||'';
      document.getElementById('oCanal').value = o.canal||'';
      document.getElementById('oObs').value = o.obs||'';
      openModal('modalOrcamento');
    });
  });

  document.getElementById('btnClienteRapido')?.addEventListener('click', async ()=>{
    const nome = prompt('Nome do cliente:');
    if(!nome) return;
    const telefone = prompt('Telefone / WhatsApp (opcional):') || '';
    const novoCliente = { id: uid(), nome, telefone, email:'', obs:'', dataCadastro: new Date().toISOString().slice(0,10) };
    state.clientes.push(novoCliente);
    await saveData();
    const select = document.getElementById('oClienteId');
    select.innerHTML = `<option value="">Selecione um cliente</option>` +
      state.clientes.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('');
    select.value = novoCliente.id;
  });

  document.getElementById('salvarOrcamento')?.addEventListener('click', async ()=>{
    const id = document.getElementById('orcamentoId').value;
    const clienteId = document.getElementById('oClienteId').value;
    const aparelhoDesejado = document.getElementById('oAparelhoDesejado').value.trim();
    const valorOrcado = parseFloat(document.getElementById('oValor').value)||0;
    const dataOrcamento = document.getElementById('oData').value;
    if(!clienteId){ alert('Selecione um cliente (ou cadastre um novo).'); return; }
    if(!aparelhoDesejado || !dataOrcamento){ alert('Informe o aparelho de interesse e a data.'); return; }
    const data = {
      clienteId, aparelhoDesejado, valorOrcado, dataOrcamento,
      canal: document.getElementById('oCanal').value.trim(),
      obs: document.getElementById('oObs').value.trim(),
    };
    if(id){
      const o = state.orcamentos.find(x=>x.id===id);
      Object.assign(o, data);
    }else{
      state.orcamentos.push({ id: uid(), status:'aberto', socio: session.nome, ...data });
    }
    await saveData();
    closeModal('modalOrcamento');
    render();
  });

  // tabela de preços
  const spEl = document.getElementById('searchPrecos');
  if(spEl) spEl.addEventListener('input', e=>{ searchTerm = e.target.value; render(); refocusSearch('searchPrecos'); });

  const btnNovoPreco = document.getElementById('btnNovoPreco');
  if(btnNovoPreco) btnNovoPreco.addEventListener('click', ()=>{
    document.getElementById('modalPrecoTitle').textContent = 'Novo modelo';
    ['precoId','pMarca','pModelo','pPrecoCompra','pPrecoVenda','pObs'].forEach(id=>document.getElementById(id).value='');
    openModal('modalPreco');
  });

  document.querySelectorAll('[data-editar-preco]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = state.precos.find(x=>x.id===btn.dataset.editarPreco);
      document.getElementById('modalPrecoTitle').textContent = 'Editar modelo';
      document.getElementById('precoId').value = p.id;
      document.getElementById('pMarca').value = p.marca||'';
      document.getElementById('pModelo').value = p.modelo||'';
      document.getElementById('pPrecoCompra').value = p.precoCompra||'';
      document.getElementById('pPrecoVenda').value = p.precoVenda||'';
      document.getElementById('pObs').value = p.obs||'';
      openModal('modalPreco');
    });
  });

  document.querySelectorAll('[data-remover-preco]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Remover este modelo da tabela de preços?')) return;
      state.precos = state.precos.filter(p=>p.id!==btn.dataset.removerPreco);
      await saveData();
      render();
    });
  });

  document.getElementById('salvarPreco')?.addEventListener('click', async ()=>{
    const id = document.getElementById('precoId').value;
    const marca = document.getElementById('pMarca').value.trim();
    const modelo = document.getElementById('pModelo').value.trim();
    if(!marca || !modelo){ alert('Informe marca e modelo.'); return; }
    const data = {
      marca, modelo,
      precoCompra: parseFloat(document.getElementById('pPrecoCompra').value)||0,
      precoVenda: parseFloat(document.getElementById('pPrecoVenda').value)||0,
      obs: document.getElementById('pObs').value.trim(),
    };
    if(id){
      const p = state.precos.find(x=>x.id===id);
      Object.assign(p, data);
    }else{
      state.precos.push({ id: uid(), ...data });
    }
    await saveData();
    closeModal('modalPreco');
    render();
  });

  document.querySelectorAll('[data-close-modal]').forEach(btn=>{
    btn.addEventListener('click', ()=>closeModal(btn.dataset.closeModal));
  });

  document.getElementById('salvarAparelho')?.addEventListener('click', async ()=>{
    const id = document.getElementById('aparelhoId').value;
    const marca = document.getElementById('fMarca').value.trim();
    const modelo = document.getElementById('fModelo').value.trim();
    if(!marca || !modelo){ alert('Informe marca e modelo.'); return; }
    const data = {
      marca, modelo,
      armazenamento: document.getElementById('fArmazenamento').value.trim(),
      cor: document.getElementById('fCor').value.trim(),
      imei: document.getElementById('fImei').value.trim(),
      fotosDriveUrl: document.getElementById('fFotosUrl').value.trim(),
      custo: parseFloat(document.getElementById('fCusto').value)||0,
      dataEntrada: document.getElementById('fDataEntrada').value,
      condicao: document.getElementById('fCondicao').value.trim(),
      obs: document.getElementById('fObs').value.trim(),
    };
    if(id){
      const ap = state.aparelhos.find(a=>a.id===id);
      Object.assign(ap, data);
    }else{
      state.aparelhos.push({ id: uid(), origem:'compra', status:'estoque', ...data });
    }
    await saveData();
    closeModal('modalAparelho');
    render();
  });

  document.getElementById('confirmarVenda')?.addEventListener('click', async ()=>{
    let aparelhoId = document.getElementById('vendaAparelhoId').value;
    if(!aparelhoId){ aparelhoId = document.getElementById('vAparelhoSelect').value; }
    const comprador = document.getElementById('vComprador').value.trim();
    const valorVenda = parseFloat(document.getElementById('vValor').value);
    const dataVenda = document.getElementById('vData').value;
    if(!aparelhoId){ alert('Selecione o aparelho vendido.'); return; }
    if(!comprador || !valorVenda || !dataVenda){ alert('Preencha comprador, valor e data.'); return; }

    let trocaAparelhoId = null;
    if(document.getElementById('vTemTroca').checked){
      const tMarca = document.getElementById('tMarca').value.trim();
      const tModelo = document.getElementById('tModelo').value.trim();
      if(!tMarca || !tModelo){ alert('Informe marca e modelo do aparelho recebido na troca.'); return; }
      const novoAparelho = {
        id: uid(), origem:'troca', status:'estoque',
        marca: tMarca, modelo: tModelo,
        imei: document.getElementById('tImei').value.trim(),
        fotosDriveUrl: document.getElementById('tFotosUrl').value.trim(),
        custo: parseFloat(document.getElementById('tValor').value)||0,
        dataEntrada: dataVenda,
        condicao: document.getElementById('tCondicao').value.trim(),
        obs: `Recebido na troca pela venda para ${comprador}`,
      };
      state.aparelhos.push(novoAparelho);
      trocaAparelhoId = novoAparelho.id;
    }

    const clienteId = document.getElementById('vendaClienteId').value || null;
    const orcamentoId = document.getElementById('vendaOrcamentoId').value || null;

    const venda = {
      id: uid(), aparelhoId, comprador, clienteId,
      contato: document.getElementById('vContato').value.trim(),
      valorVenda, dataVenda,
      formaPagamento: document.getElementById('vFormaPagamento').value.trim(),
      garantiaAte: addMonths(dataVenda, 3),
      socio: session.nome,
      trocaAparelhoId,
    };
    state.vendas.push(venda);
    const ap = state.aparelhos.find(a=>a.id===aparelhoId);
    if(ap){ ap.status = 'vendido'; }

    if(orcamentoId){
      const o = state.orcamentos.find(x=>x.id===orcamentoId);
      if(o){ o.status = 'convertido'; o.vendaId = venda.id; }
    }

    await saveData();
    closeModal('modalVenda');
    render();
  });
}

function refocusSearch(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

// ---------------- INIT ----------------
setupPWA();
loadData();
</script>
